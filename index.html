<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5a4a"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<title>قلب القرآن</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4efe4;--card:#fffdf8;--ink:#23302b;--mut:#6b7770;--acc:#1f5a4a;--line:#0002;--acct:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a18;--card:#222623;--ink:#ecece6;--mut:#9aa39d;--acc:#5fbf9f;--line:#fff2;--acct:#10201a}}
:root[data-theme="dark"]{--bg:#171a18;--card:#222623;--ink:#ecece6;--mut:#9aa39d;--acc:#5fbf9f;--line:#fff2;--acct:#10201a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;display:flex;flex-direction:column}
header{flex:none;padding:10px 14px;font-size:20px;font-weight:700;color:var(--acc);display:flex;justify-content:space-between;align-items:center}
header small{font-size:13px;color:var(--mut);font-weight:400}
main{flex:1;overflow:auto;position:relative}
.v{display:none;padding:0 12px 16px}.v.on{display:block}
nav{flex:none;display:flex;background:var(--card);border-top:1px solid var(--line)}
nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:12px;padding:8px 0 6px;cursor:pointer}
nav button b{display:block;font-size:22px;font-weight:400}
nav button.on{color:var(--acc);font-weight:700}
.card{background:var(--card);border-radius:14px;padding:12px;margin:8px 0;box-shadow:0 1px 3px var(--line)}
.row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border:0}.row .n{width:30px;color:var(--mut);font-size:13px;text-align:center}
.row .t{flex:1}.row .t small{display:block;color:var(--mut);font-size:12px}
.dot{width:14px;height:14px;border-radius:50%;border:1px solid #0004;flex:none}
.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
.btn.p{background:var(--acc);color:var(--acct);border-color:transparent}
.btn.g{background:none}
#heartWrap{overflow:hidden;background:#fff;border-radius:12px;flex:1;min-height:0;touch-action:none}
#heartWrap svg{display:block;width:100%;height:auto}
.zb{position:absolute;bottom:52px;inset-inline-start:22px;display:flex;flex-direction:column;gap:6px}
.zb .btn{width:40px;height:40px;padding:0;font-size:20px;box-shadow:0 2px 6px #0004}
#hv{padding:0 12px;height:100%}#hv.on{display:flex;flex-direction:column}
.leg{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mut);padding:6px 4px}.leg i{display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid #0004;vertical-align:-1px;margin-inline-end:4px}
.r path{fill:#fff}.r path[data-s]{cursor:pointer}.k{fill:#000;fill-rule:evenodd;pointer-events:none}
.st0{fill:#fff!important}.st1{fill:#8fc7ff!important}.st2{fill:#a6e3b0!important}.st3{fill:#ffcf99!important}.st4{fill:#ff9e9e!important}
.bg0{background:#fff}.bg1{background:#8fc7ff}.bg2{background:#a6e3b0}.bg3{background:#ffcf99}.bg4{background:#ff9e9e}
input[type=search],textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{padding:5px 11px;border-radius:99px;border:1px solid var(--line);font-size:13px;cursor:pointer;background:var(--card)}.chip.on{background:var(--acc);color:var(--acct)}
.bar{height:12px;border-radius:9px;background:var(--line);overflow:hidden;margin:8px 0}.bar div{height:100%;background:var(--acc)}
.big{font-size:34px;font-weight:700;color:var(--acc)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#sheet{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:9}#sheet.on{display:flex}
#sheet>div{background:var(--card);width:100%;max-height:85%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.btns .btn{flex:1;min-width:90px}
h3{margin:14px 0 6px;font-size:15px;color:var(--mut)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;padding:9px 14px;border-radius:99px;font-size:14px;z-index:20;display:none;white-space:nowrap}#toast.on{display:block}#toast button{background:none;border:0;color:#8fd;font:inherit;font-weight:700;margin-inline-start:8px;cursor:pointer}
input[type=number],input[type=time],input[type=text]:not(#q),#lad{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}input[type=number]{width:84px}#lad{width:100%}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--mut)}.card small{display:block;color:var(--mut);font-size:12px;margin-top:6px}.ti{cursor:pointer}
</style></head><body>

function undo(){if(!U.length)return;D=JSON.parse(U.pop());save();paint();$("#toast").classList.remove("on")}
function addRange(i,a,b,st){act(()=>{const o=gs(i),n=[];for(const r of o.r){if(r.b<a||r.a>b)n.push(r);else{if(r.a<a)n.push({...r,b:a-1,h:[...r.h]});if(r.b>b)n.push({...r,a:b+1,h:[...r.h]})}}
 n.push({a,b,st,lv:0,due:st==2?addDays(today(),D.cfg.lad[0]):null,last:st==2?today():null,h:[]});o.r=n.sort((p,q)=>p.a-q.a)},"تمت الإضافة")}
function grade(i,k,g){act(()=>{const x=D.s[i].r[k],L=D.cfg.lad;x.lv=g==2?Math.min(L.length-1,x.lv+1):g==1?x.lv:0;x.due=addDays(today(),L[x.lv]);x.last=today();x.h.push([today(),g])},"تم تسجيل المراجعة")}
const memDone=(i,k)=>act(()=>{const x=D.s[i].r[k];x.st=2;x.lv=0;x.due=addDays(today(),D.cfg.lad[0]);x.last=today()},"تم: محفوظة");
const delR=(i,k)=>act(()=>{D.s[i].r.splice(k,1)},"تم الحذف");

function badges(){const o=$("#bd");if(o)o.remove();const g=el("g",{id:"bd"});g.style.pointerEvents="none";const by={};for(const it of items())by[it.i]=Math.max(by[it.i]===undefined?-9:by[it.i],it.late);
 for(const i in by){const[x,y]=P[i],late=by[i]>3;g.append(el("circle",{cx:x,cy:y,r:8,fill:late?"#7b2cbf":"#ff9800",stroke:"#fff","stroke-width":2}));const t=el("text",{x:x,y:y+4.5,"text-anchor":"middle","font-size":13,"font-weight":700,fill:"#fff"});t.textContent="!";g.append(t)}
 $("#hs").append(g)}

function paint(){document.querySelectorAll("#r path[data-s]").forEach(p=>p.style.fill=fill(+p.dataset.s));badges();const a=todayItems()[0];

 ({tv:today_,lv:list_,sv:stats_,gv:set_})[hv()]?.();if($("#sheet").classList.contains("on")&&cur)sheet(cur)}
const row=i=>{const[m,l]=cover(i);return`<div class="row" data-i="${i}"><span class="n">${i}</span><span class="dot" style="background:${fill(i)}"></span><span class="t">${N[i-1]}<small>${A[i-1]} آية${m+l?` · محفوظ ${Math.round(m*A[i-1])} · قيد الحفظ ${Math.round(l*A[i-1])}`:""}</small></span></div>`};
const gb=(i,k,c)=>`<div class="btns"><button class="btn p" data-g="${i},${k},2">سهلة ✓</button><button class="btn" data-g="${i},${k},1">اتردد</button><button class="btn" data-g="${i},${k},0">نسيت</button></div>`;
function today_(){const[a,b]=todayItems(),Q=+D.cfg.quota,l=[];for(const i in D.s)if(D.s[i].r.some(x=>x.st==1))l.push(+i);
 const sum=a.reduce((s,it)=>s+it.x.b-it.x.a+1,0);
 $("#tv").innerHTML=`<h3>راجع النهارده (${a.length}${Q?` · ${sum} آية من حصة ${Q}`:""})</h3>${a.length?a.map(it=>`<div class="card"><div class="ti" data-i="${it.i}"><b>${N[it.i-1]}</b> · آية ${it.x.a}–${it.x.b} <small style="color:var(--mut)">(${it.x.b-it.x.a+1} آية)</small><div style="font-size:12px;color:var(--mut)">${it.late>0?"متأخرة "+it.late+" يوم":"موعدها اليوم"}</div></div>${gb(it.i,it.k)}</div>`).join(""):'<div class="card" style="color:var(--mut)">مفيش مراجعات مستحقة. افتح سورة من القلب وأضف نطاق حفظ.</div>'}
 ${b.length?`<p style="color:var(--mut);font-size:13px">+${b.length} مراجعة مؤجلة لبكرة (حسب الحصة اليومية)</p>`:""}
 <h3>بتحفظها حاليًا (${l.length})</h3><div class="card">${l.length?l.map(row).join(""):'<span style="color:var(--mut)">لسه مفيش سورة قيد الحفظ.</span>'}</div>`}
function list_(){const ch=["الكل","لم تبدأ","قيد الحفظ","محفوظة كاملة","للمراجعة"];
 $("#lv").innerHTML=`<div style="padding-top:4px"><input type="search" id="q" placeholder="ابحث عن سورة" value="${q}"></div><div class="chips">${ch.map((c,k)=>`<span class="chip${flt==k-1?" on":""}" data-f="${k-1}">${c}</span>`).join("")}</div><div class="card" id="ll"></div>`;fill_()}
function fill_(){const nq=q.replace(/[\u064B-\u0652ـ]/g,"").replace(/[أإآ]/g,"ا"),dz=new Set(items().map(x=>x.i));let h="";
 for(let i=1;i<=114;i++){const[m,l]=cover(i);if(flt==0&&m+l)continue;if(flt==1&&!l)continue;if(flt==2&&m<.999)continue;if(flt==3&&!dz.has(i))continue;
  if(nq&&!N[i-1].replace(/[أإآ]/g,"ا").includes(nq))continue;h+=row(i)}
 $("#ll").innerHTML=h||'<span style="color:var(--mut)">لا نتائج</span>'}
function pct(){let ay=0;for(let i=1;i<=114;i++)ay+=cover(i)[0]*A[i-1];return ay}
function stats_(){let full=0,l=0;for(let i=1;i<=114;i++){const[m,x]=cover(i);if(m>=.999)full++;l+=x*A[i-1]}
 const ay=Math.round(pct()),p=ay/6236*100,set=new Set(D.log);let sk=0,d=today();if(!set.has(d))d=addDays(d,-1);while(set.has(d)){sk++;d=addDays(d,-1)}
 $("#sv").innerHTML=`<div class="card"><div class="big">${p.toFixed(1)}%</div>من القرآن محفوظ (${ay} من 6236 آية)<div class="bar"><div style="width:${p}%"></div></div></div>
 <div class="grid"><div class="card"><div class="big">${full}</div>سورة كاملة</div><div class="card"><div class="big">${Math.round(l)}</div>آية قيد الحفظ</div><div class="card"><div class="big">${sk}</div>أيام متتالية</div><div class="card"><div class="big">${todayItems()[0].length}</div>مراجعات اليوم</div></div>
 <div class="btns"><button class="btn p" data-share="1">📤 مشاركة صورة القلب</button><button class="btn" data-undo="1">↶ تراجع عن آخر تغيير</button></div>
 <h3>نسخة احتياطية</h3><div class="card"><textarea id="bk" rows="4" placeholder="الصق هنا نسخة محفوظة للاستيراد"></textarea><div class="btns"><button class="btn p" id="ex">تصدير</button><button class="btn" id="im">استيراد</button><button class="btn g" id="rs">مسح كل البيانات</button></div><small id="bm" style="color:var(--mut)"></small></div>`}
function set_(){const c=D.cfg;$("#gv").innerHTML=`<h3>فواصل المراجعة بالأيام (مفصولة بفاصلة)</h3><div class="card"><input id="lad" value="${c.lad.join(",")}"><small>«سهلة» تنقلك للفاصل التالي، «اتردد» تبقيك مكانك، «نسيت» ترجعك للأول.</small></div>
 <h3>حصة المراجعة اليومية (آيات، 0 = بدون حد)</h3><div class="card"><input type="number" id="qt" min="0" value="${c.quota}"><small>لو المستحق أكتر، بيظهر الأقدم تأخيرًا أولًا والباقي يتأجل.</small></div>
 <h3>التذكير</h3><div class="card">وقت التذكير <input type="time" id="rt" value="${c.rt}"><div class="btns"><button class="btn ${c.notif?"p":""}" data-ntf="1">${c.notif?"إيقاف":"تفعيل"} التنبيهات</button><button class="btn" data-ics="1">تنزيل تذكير يومي للتقويم</button></div><small>التنبيهات بتظهر لما تفتح التطبيق وفيه مراجعات. للتذكير وهو مقفول استخدم ملف التقويم.</small></div>
 <button class="btn p" data-sv="1" style="width:100%">حفظ الإعدادات</button>`}
function sheet(i){const o=gs(i),a=A[i-1],t=today(),nt=$("#nt");if(nt&&cur==i)o.note=nt.value;cur=i;let nx=1;for(const r of o.r)if(r.a<=nx&&r.b>=nx)nx=r.b+1;nx=Math.min(nx,a);
 const rs=o.r.map((x,k)=>`<div class="card"><b>آية ${x.a}–${x.b}</b> <span class="tag">${x.st==2?"محفوظة":"قيد الحفظ"}</span>${x.st==1?`<div class="btns"><button class="btn p" data-mem="${k}">أتممت حفظها</button><button class="btn g" data-del="${k}">حذف</button></div>`
  :`<div style="color:var(--mut);font-size:13px;margin:6px 0">آخر مراجعة: ${x.last||"—"} · القادمة: ${x.due}${x.due<=t?" (مستحقة)":""}</div>${gb(i,k)}<div style="font-size:12px;color:var(--mut)">${x.h.slice(-5).reverse().map(h=>h[0].slice(5)+" "+["نسيت","تردد","سهلة"][h[1]]).join(" · ")}</div><button class="btn g" data-del="${k}">حذف النطاق</button>`}</div>`).join("");
 $("#sc").innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:22px;font-weight:700">${i}. ${N[i-1]}</div><small style="color:var(--mut)">${a} آية</small></div><button class="btn g" id="cl">✕</button></div>${rs}
 <h3>إضافة نطاق (من آية إلى آية)</h3><div class="card"><div style="display:flex;gap:8px;align-items:center">من <input type="number" id="fa" min="1" max="${a}" value="${nx}"> إلى <input type="number" id="fb" min="1" max="${a}" value="${a}"></div><div class="btns"><button class="btn" data-add="1">قيد الحفظ</button><button class="btn p" data-add="2">محفوظة</button></div></div>
 <h3>ملاحظات (متشابهات، مواضع الغلط…)</h3><textarea id="nt" rows="3">${o.note||""}</textarea>`;$("#sheet").classList.add("on")}
function closeS(){if(cur&&$("#nt")){gs(cur).note=$("#nt").value;save()}$("#sheet").classList.remove("on");cur=0}
// تكبير وسحب
const wr=$("#heartWrap"),sv=$("#hs"),PT=new Map();let Vw={x:0,y:0,w:W0,h:H0},moved=0,lastTap=0,tapT;
const setV=()=>{Vw.x=Math.max(0,Math.min(W0-Vw.w,Vw.x));Vw.y=Math.max(0,Math.min(H0-Vw.h,Vw.y));sv.setAttribute("viewBox",`${Vw.x} ${Vw.y} ${Vw.w} ${Vw.h}`)};
const toSvg=(px,py)=>{const r=sv.getBoundingClientRect();return[Vw.x+(px-r.left)/r.width*Vw.w,Vw.y+(py-r.top)/r.height*Vw.h]};
function zoomAt(f,cx,cy){const nw=Math.min(W0,Math.max(W0/8,Vw.w/f)),k=nw/Vw.w;Vw.x=cx-(cx-Vw.x)*k;Vw.y=cy-(cy-Vw.y)*k;Vw.w=nw;Vw.h=nw*H0/W0;setV()}
wr.addEventListener("pointerdown",e=>{PT.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0});
["pointerup","pointercancel","pointerleave"].forEach(n=>wr.addEventListener(n,e=>PT.delete(e.pointerId)));
wr.addEventListener("pointermove",e=>{const p=PT.get(e.pointerId);if(!p)return;const px=p.x,py=p.y;p.x=e.clientX;p.y=e.clientY;const r=sv.getBoundingClientRect();
 if(PT.size==1){const dx=e.clientX-px,dy=e.clientY-py;moved+=Math.abs(dx)+Math.abs(dy);if(Vw.w<W0-1){Vw.x-=dx/r.width*Vw.w;Vw.y-=dy/r.height*Vw.h;setV()}}
 else if(PT.size==2){moved+=99;const o=[...PT.entries()].find(([id])=>id!=e.pointerId)[1],f=Math.hypot(p.x-o.x,p.y-o.y)/(Math.hypot(px-o.x,py-o.y)||1);
  Vw.x-=((p.x+o.x)/2-(px+o.x)/2)/r.width*Vw.w;Vw.y-=((p.y+o.y)/2-(py+o.y)/2)/r.height*Vw.h;const[cx,cy]=toSvg((p.x+o.x)/2,(p.y+o.y)/2);zoomAt(f,cx,cy)}});
wr.addEventListener("wheel",e=>{e.preventDefault();const[cx,cy]=toSvg(e.clientX,e.clientY);zoomAt(e.deltaY<0?1.2:1/1.2,cx,cy)},{passive:false});
function heartTap(e){if(moved>8)return;const now=Date.now(),s=e.target.closest("#r path[data-s]");
 if(now-lastTap<320){clearTimeout(tapT);lastTap=0;if(Vw.w<W0*.9){Vw={x:0,y:0,w:W0,h:H0};setV()}else{const[cx,cy]=toSvg(e.clientX,e.clientY);zoomAt(3,cx,cy)}return}
 lastTap=now;if(s){const i=+s.dataset.s;tapT=setTimeout(()=>sheet(i),300)}}
// مشاركة صورة
async function share(){const s=sv.cloneNode(true);s.setAttribute("viewBox",`0 0 ${W0} ${H0}`);s.setAttribute("width",W0);s.setAttribute("height",H0);s.removeAttribute("style");const b=s.querySelector("#bd");if(b)b.remove();
 s.querySelectorAll("#r path").forEach(p=>{p.setAttribute("fill",p.style.fill||"#fff");p.removeAttribute("style")});const k=s.querySelector(".k");k.setAttribute("fill","#000");k.setAttribute("fill-rule","evenodd");
 const img=new Image();await new Promise(r=>{img.onload=r;img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(new XMLSerializer().serializeToString(s))});
 const c=document.createElement("canvas"),z=2;c.width=W0*z;c.height=(H0+70)*z;const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,W0*z,H0*z);
 g.fillStyle="#d61f2b";g.font=`bold ${26*z}px Tahoma,Arial`;g.textAlign="center";g.direction="rtl";g.fillText(`محفوظ ${(pct()/6236*100).toFixed(1)}% من القرآن`,c.width/2,(H0+46)*z);
 c.toBlob(async bl=>{const f=new File([bl],"quran-heart.png",{type:"image/png"});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(_){}}
  const a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download="quran-heart.png";a.click()})}

function ics(){const[h,m]=D.cfg.rt.split(":"),d=new Date(),z=n=>String(n).padStart(2,"0"),st=`${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}T${z(h)}${z(m)}00`;
 const t=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//qheart//AR","BEGIN:VEVENT","UID:qheart-daily@local","DTSTAMP:"+st,"DTSTART:"+st,"DURATION:PT15M","RRULE:FREQ=DAILY","SUMMARY:مراجعة القرآن","BEGIN:VALARM","TRIGGER:PT0M","ACTION:DISPLAY","DESCRIPTION:وقت المراجعة","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/calendar"}));a.download="quran-review.ics";a.click()}
async function notify(){const n=todayItems()[0].length;try{n?navigator.setAppBadge&&navigator.setAppBadge(n):navigator.clearAppBadge&&navigator.clearAppBadge()}catch(_){}
 if(!D.cfg.notif||!n||!("Notification" in window)||Notification.permission!="granted"||D.cfg.lastN==today())return;
 const[h,m]=D.cfg.rt.split(":"),now=new Date();if(now.getHours()*60+now.getMinutes()<h*60+ +m)return;D.cfg.lastN=today();save();
 const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration(),o={body:`عندك ${n} مراجعة النهارده`,icon:"icon-192.png",tag:"qh"};reg?reg.showNotification("قلب القرآن",o):new Notification("قلب القرآن",o)}
document.addEventListener("click",e=>{const t=e.target,d=n=>t.closest("["+n+"]");
 const nb=t.closest("#nav button");if(nb){document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("on",x==nb));document.querySelectorAll(".v").forEach(x=>x.classList.toggle("on",x.id==nb.dataset.v));return paint()}
 if(t.closest("#heartWrap"))return heartTap(e);
 if(t.id=="sheet"||t.id=="cl")return closeS();
 let x;if(x=d("data-undo"))return undo();
 if(x=d("data-g")){const[i,k,g]=x.dataset.g.split(",").map(Number);return grade(i,k,g)}
 if(x=d("data-mem"))return memDone(cur,+x.dataset.mem);
 if(x=d("data-del"))return delR(cur,+x.dataset.del);
 if(x=d("data-add")){const a=+$("#fa").value,b=+$("#fb").value;if(!(a>=1&&b>=a&&b<=A[cur-1]))return toastMsg("اكتب نطاق صحيح");return addRange(cur,a,b,+x.dataset.add)}
 if(d("data-share"))return share();
 if(d("data-ics"))return ics();
 if(d("data-ntf")){if(D.cfg.notif){D.cfg.notif=false;save();return set_()}if(!("Notification" in window))return alert("المتصفح لا يدعم التنبيهات");Notification.requestPermission().then(p=>{D.cfg.notif=p=="granted";save();set_();notify()});return}
 if(d("data-sv")){const l=$("#lad").value.split(/[,،]/).map(v=>Math.round(+v)).filter(v=>v>0);if(l.length)D.cfg.lad=l;D.cfg.quota=Math.max(0,+$("#qt").value||0);D.cfg.rt=$("#rt").value||"20:00";for(const i in D.s)D.s[i].r.forEach(r=>r.lv=Math.min(r.lv,D.cfg.lad.length-1));save();paint();return toastMsg("تم حفظ الإعدادات")}
 const ro=t.closest(".row,.ti");if(ro)return sheet(+ro.dataset.i);
 const ch=t.closest(".chip");if(ch){flt=+ch.dataset.f;return list_()}
 if(t.id=="ex"){$("#bk").value=JSON.stringify(D);$("#bk").select();$("#bm").textContent="انسخ النص واحتفظ به."}
 if(t.id=="im"){try{const o=JSON.parse($("#bk").value);if(!o.s)throw 0;D=Object.assign(DEF(),o);D.cfg=Object.assign(DEF().cfg,o.cfg);save();paint();$("#bm").textContent="تم الاستيراد."}catch(_){$("#bm").textContent="النص غير صالح."}}
 if(t.id=="rs"&&confirm("مسح كل بيانات الحفظ؟")){snap();D=DEF();save();paint()}
 if(t.id=="zi"||t.id=="zo"){zoomAt(t.id=="zi"?1.5:1/1.5,Vw.x+Vw.w/2,Vw.y+Vw.h/2)}});
function toastMsg(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),2500)}
document.addEventListener("input",e=>{if(e.target.id=="q"){q=e.target.value;fill_()}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden){paint();notify()}});
paint();notify();try{navigator.serviceWorker&&navigator.serviceWorker.register("sw.js")}catch(e){}

</script></body></html>
